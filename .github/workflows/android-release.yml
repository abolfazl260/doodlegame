name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Run game regression tests
        run: npm test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "Tag $GITHUB_REF_NAME must match package.json version v$VERSION"
            exit 1
          }

      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || {
              echo "$name secret is required"
              exit 1
            }
          done

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doodlegame-release.jks"

      - name: Prepare Android project
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/doodlegame-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:sync

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/doodlegame-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android/gradle.mjs assembleRelease bundleRelease

      - name: Audit Google Play privacy surface
        run: npm run android:audit:privacy

      - name: Verify production hardening
        run: npm run android:verify:production

      - name: Verify Google Play reviewer readiness
        run: npm run android:verify:review

      - name: Upload reviewer readiness report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-review-readiness
          path: artifacts/review-readiness/
          if-no-files-found: error

      - name: Upload production hardening report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-production-hardening
          path: artifacts/production-hardening/
          if-no-files-found: error

      - name: Upload privacy audit report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-privacy-audit
          path: artifacts/privacy-audit/
          if-no-files-found: error

      - name: Verify signed Google Play artifact
        run: npm run android:verify:play -- --apk android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Google Play compliance report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-play-compliance
          path: artifacts/play-compliance/
          if-no-files-found: error

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||             gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME"             android/app/build/outputs/apk/release/app-release.apk             android/app/build/outputs/bundle/release/app-release.aab             --clobber
