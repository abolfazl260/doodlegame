name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Run game regression tests
        run: npm test

      - name: Build Android debug APK
        run: npm run android:build:debug

      - name: Validate unsigned release APK and AAB
        run: node scripts/android/gradle.mjs assembleRelease bundleRelease

      - name: Verify Google Play technical compliance
        run: npm run android:verify:play

      - name: Audit Google Play privacy surface
        run: npm run android:audit:privacy

      - name: Verify production hardening
        run: npm run android:verify:production

      - name: Upload production hardening report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-production-hardening
          path: artifacts/production-hardening/
          if-no-files-found: error

      - name: Upload privacy audit report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-privacy-audit
          path: artifacts/privacy-audit/
          if-no-files-found: error

      - name: Upload Google Play compliance report
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-play-compliance
          path: artifacts/play-compliance/
          if-no-files-found: error

      - name: Report Android artifact sizes
        shell: bash
        run: |
          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/bundle/release/app-release.aab
          test "$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)" -lt 25000000
          test "$(stat -c%s android/app/build/outputs/apk/release/app-release-unsigned.apk)" -lt 25000000
          test "$(stat -c%s android/app/build/outputs/bundle/release/app-release.aab)" -lt 25000000

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: doodlegame-debug-apk
          path: artifacts

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android/emulator-smoke.sh artifacts/app-debug.apk

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-emulator-smoke
          path: |
            android-smoke-launch.png
            android-smoke-final.png
            emulator-logcat.txt
          if-no-files-found: warn
