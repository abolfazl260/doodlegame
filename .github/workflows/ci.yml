name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Physics and motion regressions
        run: npm test

      - name: Build
        run: npm run build

      - name: Enforce JS bundle budget
        run: npm run ci:bundle-budget

      - name: Upload Core Vitals build metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-core-vitals-build
          path: artifacts/core-vitals/
          if-no-files-found: warn
