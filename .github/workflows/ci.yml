name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep a single current PR validation run; let push-to-main checks finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Physics and motion regressions
        run: npm test

      - name: Verify monetization guardrail
        run: npm run ci:verify-monetization

      - name: Verify target audience guardrail
        run: npm run ci:verify-audience

      - name: Upload target audience audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-audience-audit
          path: artifacts/audience-audit/
          if-no-files-found: warn

      - name: Upload monetization dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-monetization-guardrail
          path: artifacts/monetization-guardrail/
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Enforce JS bundle budget
        run: npm run ci:bundle-budget

      - name: Upload Core Vitals build metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodlegame-core-vitals-build
          path: artifacts/core-vitals/
          if-no-files-found: warn
