<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>DoodleGame</title>
    <style>
      html,body{margin:0;width:100%;height:100%;background:#000}
      #boot-fallback{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:16px system-ui,sans-serif;z-index:9999}
    </style>
  </head>
  <body>
    <div id="boot-fallback">DoodleGame — Loading…</div>
    <main id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </main>
    <div id="orientation-guard" role="dialog" aria-modal="true" aria-labelledby="orientation-guard-title" aria-describedby="orientation-guard-message">
      <div class="orientation-guard__content">
        <div class="orientation-guard__icon" aria-hidden="true">↻</div>
        <h1 id="orientation-guard-title">حالت افقی الزامی است</h1>
        <p id="orientation-guard-message">برای اجرای بازی دستگاه را افقی بچرخانید.</p>
        <button id="orientation-guard-button" type="button">تلاش برای چرخش خودکار</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
